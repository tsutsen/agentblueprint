<!-- ─── Sidebar Component ─── -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>Glossary Graph</h1>
    <div class="subtitle" id="project-name">Loading...</div>
  </div>
  <div id="search-box">
    <div class="search-wrapper">
      <input type="text" id="search-input" placeholder="Search terms or IDs...">
    </div>
  </div>
  <div id="filters">
    <h3>Categories</h3>
    <div id="category-filters"></div>
  </div>
  <div id="term-list"></div>
  <style>
    .term-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .term-list-item .item-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .term-list-item .item-id {
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .term-list-item .item-cat {
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
      white-space: nowrap;
    }
  </style>
</div>
