<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glossary Link Graph</title>
  <link rel="stylesheet" href="graph.css">
  <link rel="stylesheet" href="theme-default-light.css" id="theme-default-light" disabled>
  <link rel="stylesheet" href="theme-gruvbox.css" id="theme-gruvbox" disabled>
  <link rel="stylesheet" href="theme-gruvbox-light.css" id="theme-gruvbox-light" disabled>
  <link rel="stylesheet" href="theme-neon-dark.css" id="theme-neon-dark" disabled>
  <link rel="stylesheet" href="theme-retro-light.css" id="theme-retro-light" disabled>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- ─── Sidebar ─── -->
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>Glossary Graph</h1>
        <div class="subtitle" id="project-name">Loading...</div>
      </div>
      <div id="search-box">
        <div class="search-wrapper">
          <input type="text" id="search-input" placeholder="Search terms or IDs...">
        </div>
      </div>
      <div id="filters">
        <h3>Categories</h3>
        <div id="category-filters"></div>
      </div>
      <div id="term-list"></div>
    </div>

    <!-- ─── Canvas ─── -->
    <div id="canvas-container">
      <div id="graph-container">
        <canvas id="graph-canvas"></canvas>

        <div id="controls">
          <button id="btn-zoom-reset">Reset view</button>
          <button id="btn-simulate">Simulate</button>

          <!-- Size metric dropdown (native <details>) -->
          <details class="dropdown size-dropdown" id="size-metric-dropdown">
            <summary id="btn-size-metric">Size: Degree</summary>
            <div class="dropdown-menu" id="size-metric-menu">
              <div class="dropdown-item active" data-metric="degree">Degree</div>
              <div class="dropdown-item" data-metric="blast">Blast Radius</div>
              <div class="dropdown-item" data-metric="risk">Risk Score</div>
            </div>
          </details>

          <button id="btn-labels" class="active">Labels</button>

          <!-- Theme dropdown (native <details>) -->
          <details class="dropdown theme-dropdown" id="theme-dropdown">
            <summary id="btn-theme">Theme</summary>
            <div class="dropdown-menu" id="theme-menu">
              <div class="dropdown-item" data-theme="default">Default</div>
              <div class="dropdown-item" data-theme="default-light">Default Light</div>
              <div class="dropdown-item" data-theme="gruvbox">Gruvbox</div>
              <div class="dropdown-item" data-theme="gruvbox-light">Gruvbox Light</div>
              <div class="dropdown-item" data-theme="neon-dark">Neon Dark</div>
              <div class="dropdown-item" data-theme="retro-light">Retro Light</div>
            </div>
          </details>
        </div>

        <div id="legend">
          <h4>Connections</h4>
          <div class="legend-row">
            <div class="legend-line legend-line-related"></div>
            <span>Related terms</span>
          </div>
          <div class="legend-row">
            <div class="legend-line legend-line-spec"></div>
            <span>Spec references</span>
          </div>
          <div class="legend-row">
            <div class="legend-line legend-line-cross"></div>
            <span>Cross-spec</span>
          </div>
        </div>

        <div id="detail-panel">
          <button class="close-btn" id="close-detail" aria-label="Close detail">&times;</button>
          <div class="detail-header">
            <span class="term-name" id="detail-name"></span>
            <div class="detail-meta">
              <span class="category-badge" id="detail-category"></span>
              <span class="term-id" id="detail-id"></span>
            </div>
          </div>
          <div class="detail-def" id="detail-def"></div>
          <div class="detail-stats" id="detail-stats"></div>
        </div>

        <div id="labels-container"></div>

        <div id="loading-overlay">
          <div class="loading-spinner"></div>
          <div id="loading-text">Laying out graph&hellip; (F12 for console)</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Error template (shown by JS on JS errors) ─── -->
  <template id="error-template">
    <div class="error-message">
      <strong>JavaScript Error</strong><br><br>
      <code class="error-code"></code><br><br>
      <span class="error-location"></span><br><br>
      <span class="error-hint">Check browser console (F12) for details</span>
    </div>
  </template>

  <script type="module" src="config.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="graph.js"></script>
  <script type="module" src="ui.js"></script>
</body>
</html>
