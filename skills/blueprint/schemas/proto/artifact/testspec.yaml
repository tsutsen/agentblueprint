artifact: testspec
title: TestSpec
schemaVersion: "3.0.0"
description: "Test specification for all API functions"

fields:
  - name: functionCoverage
    type: array
    minItems: 1
    of:
      type: object
      ref: fc
      required: [fnRef, happyPathCount, edgeCaseCount, errorPathCount, outOfScope]
      fields:
        - name: fnRef
          type: string
          ref: fn
        - name: happyPathCount
          type: integer
          minimum: 0
        - name: edgeCaseCount
          type: integer
          minimum: 0
        - name: errorPathCount
          type: integer
          minimum: 0
        - name: outOfScope
          type: array
          minItems: 1
          of:
            type: object
            required: [description]
            fields:
              - name: description
                type: string
                minLength: 1
        - name: reqRefs
          type: array
          ref: req

  - name: tests
    type: array
    minItems: 1
    of:
      type: object
      ref: tst
      required: [fnRef, category, description, input, contractClause]
      fields:
        - name: name
          type: string
          minLength: 1
        - name: fnRef
          type: string
          ref: fn
        - name: category
          type: enum
          enum: [happy-path, edge-case, error-path]
        - name: description
          type: string
          minLength: 5
        - name: input
          type: object
        - name: expectedOutput
          type: any
        - name: expectedOutputType
          type: string
        - name: contractClause
          type: string
          minLength: 5
        - name: reqRefs
          type: array
          ref: req
        - name: errorCode
          type: string
        - name: expectedError
          type: object
          fields:
            - name: code
              type: string
            - name: returnType
              type: string
            - name: messageContains
              type: string
        - name: scRefs
          type: array
          ref: sc
        - name: nfrRefs
          type: array
          ref: nfr
        - name: entityRefs
          type: array
          ref: ent
        - name: constraintRefs
          type: array
          ref: con
        - name: usRefs
          type: array
          ref: us
        - name: ujRefs
          type: array
          ref: uj
        - name: screenRefs
          type: array
          ref: scr
