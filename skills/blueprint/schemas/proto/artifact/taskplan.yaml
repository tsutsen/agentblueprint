artifact: taskplan
title: TaskPlan
schemaVersion: "1.0.0"
description: "Sequenced set of epics and milestones"

fields:
  - name: milestones
    type: array
    minItems: 1
    of:
      type: object
      ref: mil
      required: [outcome, epics]
      fields:
        - name: outcome
          type: string
          minLength: 10
        - name: epics
          type: array
          minItems: 1
          ref: ep

  - name: epics
    type: array
    minItems: 1
    of:
      type: object
      ref: ep
      required: [title, milestone, requirements, summary]
      fields:
        - name: title
          type: string
          minLength: 5
        - name: status
          type: enum
          enum: [not_started, in_progress, complete]
          default: not_started
          desc: "Lifecycle status of this epic."
        - name: milestone
          type: string
          ref: mil
        - name: requirements
          type: array
          minItems: 1
          ref: req
        - name: summary
          type: string
          minLength: 10
        - name: objective
          type: string
        - name: scope
          type: object
          fields:
            - name: inScope
              type: array
              minItems: 1
              of: { type: string, minLength: 5 }
            - name: outOfScope
              type: array
              minItems: 1
              of: { type: string, minLength: 5 }
        - name: acceptanceCriteria
          type: array
          minItems: 1
          of: { type: string, minLength: 10 }
        - name: specDependencies
          type: object
          fields:
            - name: blockedBy
              type: array
              ref: ep
            - name: blocks
              type: array
              ref: ep
        - name: notes
          type: string
        - name: filePath
          type: string
        - name: designRefs
          type: array
          of: { type: string }
        - name: archRefs
          type: array
          of: { type: string }
