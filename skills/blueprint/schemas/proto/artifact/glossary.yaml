artifact: glossary
title: Glossary
schemaVersion: "2.0.0"
description: "Project vocabulary"

fields:
  - name: terms
    type: array
    minItems: 1
    of:
      type: object
      ref: gl
      required: [definition, category]
      fields:
        - name: definition
          type: string
          minLength: 10
        - name: examples
          type: array
          of: { type: string, minLength: 1 }
        - name: synonyms
          type: array
          of: { type: string, minLength: 1 }
        - name: relatedTerms
          type: array
          ref: gl
        - name: category
          type: enum
          enum: [domain, technical, security, ui]
