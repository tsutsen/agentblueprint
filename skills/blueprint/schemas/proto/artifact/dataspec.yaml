artifact: dataspec
title: DataSpec
schemaVersion: "1.0.0"
description: "Structural specification of all entities, types, and relationships"

fields:
  - name: primitives
    type: array
    minItems: 1
    of:
      type: object
      ref: prim

  - name: enums
    type: array
    of:
      type: object
      ref: num
      required: [values]
      fields:
        - name: values
          type: array
          minItems: 1
          of:
            type: object
            required: [name]
            fields:
              - name: name
                type: string
              - name: description
                type: string

  - name: entities
    type: array
    minItems: 1
    of:
      type: object
      ref: ent
      required: [fields]
      fields:
        - name: abstract
          type: boolean
          default: false
        - name: fields
          type: array
          minItems: 1
          of:
            type: object
            ref: FLD
            required: [name, type]
            fields:
              - name: type
                type: string
              - name: required
                type: boolean
                default: true
              - name: example
                type: any
              - name: primaryKey
                type: boolean
                default: false
        - name: methods
          type: array
          of:
            type: object
            ref: FUNC
            required: [name, apiRef]
            fields:
              - name: apiRef
                type: string
                ref: func
        - name: visibility
          type: enum
          enum: [public, internal]
          default: public
        - name: componentRefs
          type: array
          ref: comp
        - name: reqRefs
          type: array
          ref: req
        - name: nfrRefs
          type: array
          ref: nfr
        - name: constraintRefs
          type: array
          ref: con

  - name: relationships
    type: array
    minItems: 1
    of:
      type: object
      ref: rel
      required: [from, to, type]
      fields:
        - name: from
          type: string
        - name: to
          type: string
        - name: type
          type: enum
          enum: [association, composition, aggregation, dependency, realization]
        - name: cardinality
          type: object
          fields:
            - name: fromLabel
              type: enum
              enum: ["1", "0..1", "1..*", "*", "0..*"]
            - name: toLabel
              type: enum
              enum: ["1", "0..1", "1..*", "*", "0..*"]
        - name: label
          type: string
        - name: reqRefs
          type: array
          ref: req
